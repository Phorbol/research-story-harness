  "notes": "结果是在五个靶点上都找到了结合蛋白，选出的实验面板总体命中率约为19%。命中定义是在10微摩尔浓度下，BLI响应达到阳性对照最大响应的一半。左图保留了作者与此前Rosetta流程的比较，不过需要认真看口径：旧流程采用酵母表面展示，当前流程采用BLI，所以纵轴对应不同检测方式。作者估计，整体约两个数量级的提升中，一个数量级来自RFdiffusion，另一个来自AF2筛选。这是作者对流程贡献的归因，不是把全部增益都独立归给扩散模型的随机对照实验。实际含义是，至少对本文靶点，筛几十到不到一百个设计已经可以得到命中。",
