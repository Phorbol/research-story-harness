  "notes": "这页从计算支架进入功能测量。p53的一段螺旋本来就能接触MDM2，RFdiffusion在MDM2存在的情况下围绕这段螺旋生成新支架，使它保留原有接触并增加额外界面。左边可以看到粉色新增结构。右边是两种设计的生物层干涉测量，也就是BLI，拟合得到0.7和0.5纳摩尔的解离常数；数值越小表示结合越紧。原文引用的p53肽段亲和力约为600纳摩尔，所以这两个设计约提高三个数量级。这里证明的是体外结合能力，不能进一步推成细胞内抑制作用或治疗效果。",
