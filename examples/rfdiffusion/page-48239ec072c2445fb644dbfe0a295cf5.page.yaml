  "notes": "现在可以重新理解论文所说的通用性。它指多种几何条件能够通过同一扩散设计思路处理，而不是每种任务已经具有相同成熟度。单体设计的计算一致性和部分物理表征，支持能够生成稳定骨架；对称组装的SEC和电镜，支持它们按预期形成较大形状；MDM2和Ni结合测量进一步支持某些功能；HA_20则给出高分辨率结构验证。另一方面，催化位点虽然能在计算上被固定，却还没有在本文中展示催化反应活性。这种证据分层对于AI4S很重要：可计算的代理指标帮助筛选，而实验需要继续验证我们真正想要的科学对象。",
