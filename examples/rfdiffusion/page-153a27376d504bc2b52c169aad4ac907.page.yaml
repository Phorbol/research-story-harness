  "notes": "作者把六篇文献中的25个motif支架设计任务放进统一基准，每个方法、每个任务生成100个骨架，并用ProteinMPNN设计序列。这里的大数字不是设计样本的成功率，而是有没有至少找到一个通过计算指标的设计。RFdiffusion在测试的噪声设置合并后解决23类任务，按补充表汇总，RFjoint是17类，Hallucination是15类。右边的结构例子说明，输入的小片段可以被嵌入全新的骨架。需要同时保留负面结果：并不是每一类任务RFdiffusion都占优，4JHW和5YUI在两种噪声设置下都没有成功。正文对RFjoint报告19类，与表值汇总不一致；这里采用可复核表值，并保留这个差异。完整逐任务表放在备份页。",
