  "notes": "到这里，模型能补全局部motif，也能组织对称组装。结合蛋白任务进一步只给定靶标的结构和希望接触的热点，而不预先指定一个完整的结合骨架。图中黄色是固定靶点，橙色是界面热点，紫色是生成中的结合蛋白。为了学会这个任务，作者在蛋白复合物上微调RFdiffusion，也可以额外提供有利的二级结构和折叠邻接条件。生成之后仍要经过ProteinMPNN和AF2筛选，然后每个靶点选择95个设计用于实验。所以接下来报告的命中率是被筛选设计的实验命中率，并非随机抽取任意一条扩散轨迹的成功率。",
