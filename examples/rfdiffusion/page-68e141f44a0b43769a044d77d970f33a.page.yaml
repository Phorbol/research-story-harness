  "notes": "今天介绍2023年发表于Nature的RFdiffusion。这篇论文关心的不是给定一个序列预测它折叠成什么，而是反过来：如果我们想让蛋白质结合某个靶点、固定某个功能位点，能否直接生成满足这些几何要求的新结构？右边是论文中设计的流感血凝素结合蛋白，设计模型与冷冻电镜结构高度一致。接下来的主线分三步：模型为什么能生成合理骨架，条件怎样进入生成过程，以及计算一致性如何进一步落实到实验中的结构和功能。",
