  "notes": "这页建立后面所有结果的评价口径。RFdiffusion首先输出骨架，ProteinMPNN为它寻找序列，通常每个骨架采样八条序列。AF2再从单序列预测结构，用于筛选是否回到设计目标。对单体和motif任务，主要阈值是整体骨架RMSD小于2埃、pAE小于5，如果有motif则局部偏差小于1埃。这里pAE是预测的对齐误差，用作模型信心指标。结合蛋白和对称组装使用另外的设定，不能把这个阈值简单套用所有任务。更关键的是，RF和AF2在架构和训练信息上有重合，所以这种检查只提供部分独立证据。实际表达、结合测量和实验结构才回答下一层问题。",
