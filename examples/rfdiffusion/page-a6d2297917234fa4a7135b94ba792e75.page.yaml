  "notes": "为什么这套方法能覆盖多种任务？条件不是一句抽象的功能标签，而是可以放进三维空间的具体要求。指定对称群，就约束多个亚基如何排列；输入靶蛋白和界面热点，就规定新蛋白应该接近哪个表面；固定功能motif，则要求生成的骨架保留它的局部几何。右侧按行展示原作者图中的输入条件与最终结构，中间采样状态在这里省略。概念上是同一种条件生成框架，但不同任务并不意味着完全相同的权重和训练设置：结合蛋白、折叠拓扑以及催化位点任务都有相应微调。下面先从功能片段的固定展开，再看对称性与结合界面。",
