  "notes": "把motif和对称性结合，就能设计由多个亚基共同组成的功能位点。作者用四个组氨酸侧链构成方平面的镍结合几何，然后围绕它生成C4对称蛋白。功能证据比外形相似更进一步：36个接受量热测定的设计中18个结合镍离子。右下的代表性曲线比较野生型和H52A突变体，把用于配位的组氨酸换成丙氨酸后，结合明显减弱。所有成功表达的17个对应突变体都表现出丧失或显著减弱，另一个未表达。这个对照把功能与设计位点联系起来；上方电镜则支持组装形态，二者回答不同的问题。",
