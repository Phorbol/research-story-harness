  "notes": "先不提供功能条件，看看模型能不能生成合理的单体。左上给出300和600残基的设计，彩色AF2预测与灰色设计模型叠合。右图看全部采样分布，告诉我们不能只看精选图片：较短骨架偏差集中在低值区域，随着长度增长，分布变宽，800和1000残基尤其难以由单序列预测验证。因此论文展示了600残基成功设计，但并不是说600残基样本普遍都成功。实验上作者还测试了部分200和300残基设计，圆二色谱支持预期二级结构且耐高温；这些实验并没有给所有无条件设计提供原子分辨率结构。",
