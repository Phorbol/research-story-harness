  "notes": "RFdiffusion没有从零重新发明蛋白质几何。它以预训练的RoseTTAFold为基础，保留了能够处理三维残基关系的网络。在这里每个残基用一个局部刚体表示，包含Cα的位置以及N、Cα、C定义的方向。训练时，真实结构被不同程度地加噪：位置用三维高斯噪声，方向在旋转空间上扰动。网络接收带噪结构和时间信息，预测干净结构。于是输入的主角从氨基酸序列变成了带噪坐标，而已经学到的结构知识成为去噪的基础。图中的连接表达训练关系，不是新的实验轨迹。",
