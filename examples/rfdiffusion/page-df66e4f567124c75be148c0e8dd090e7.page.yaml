  "notes": "最后看一个重要边界：酶活性位点设计。左图从原酶提取少数关键残基，RFdiffusion在微调后可以围绕这些残基生成支架，并在AF2预测中保留相应几何。右图显示不同酶类别的计算成功率仍然只有几个百分点的量级，说明这是更严格、更困难的任务。这个版本不能显式建模结合的小分子，作者用外部势能间接引导口袋形成。更进一步的催化能力还取决于底物定位、反应能量和动力学等因素，本文没有给出这些新支架的催化活性实验。因此这项工作为功能设计提供了强大的几何起点，但不能把活性位点支架直接称作已经设计成功的酶。",
