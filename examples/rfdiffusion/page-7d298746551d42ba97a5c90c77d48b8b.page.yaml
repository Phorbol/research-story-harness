  "notes": "把结构预测器接到扩散采样上本身还不够。左图比较300残基无条件生成时，AF2重新预测的结构与设计骨架之间的偏差，越靠左越好。完整模型明显集中在小偏差区域；去掉预训练、去掉微调、替换均方误差目标，或去掉self-conditioning，分布都会变差。均方误差在这里不做全局对齐，帮助不同时间步保持全局坐标系连续；self-conditioning把前一步对最终结构的预测反馈给当前网络，帮助整个轨迹协调。这组结果支持组合方案的必要性，但它衡量的仍是计算一致性，并不直接等价于实验折叠成功。",
