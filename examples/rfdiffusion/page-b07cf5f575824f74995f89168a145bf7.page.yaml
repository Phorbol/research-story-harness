  "notes": "先区分三个对象。序列是一串氨基酸；骨架是这些残基在三维空间中的总体组织；功能位点则是其中承担结合或催化作用的局部几何。结构预测从序列出发，而设计需要从所需功能出发，寻找能够稳定承载这个功能的序列和结构。右图以p53的一段螺旋为例：它能接触MDM2，但我们希望有一个更大的新骨架固定这段螺旋，并形成额外接触。这样的约束通常只规定局部，剩余结构有许多可能解，因此既需要生成的多样性，也需要精准遵守条件。",
