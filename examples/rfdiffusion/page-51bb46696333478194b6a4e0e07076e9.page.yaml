  "notes": "最有说服力的结构证据来自HA_20与流感血凝素的复合物。它的结合解离常数是28纳摩尔，作者进一步用冷冻电镜得到2.9埃分辨率的复合物重建。左图是电镜类别平均与三维重建，右上把实验结构和设计模型叠合，复合物环境中的偏差为0.63埃；右下只看结合蛋白自身，偏差为0.60埃。这里要区分两个容易混淆的数字：2.9埃是实验重建的分辨率，0.63埃是模型与实验结构之间的偏差。这个案例验证了设计的结合姿态和局部构象，但它是深入表征的代表性命中，不能代替所有binder的结构验证。",
