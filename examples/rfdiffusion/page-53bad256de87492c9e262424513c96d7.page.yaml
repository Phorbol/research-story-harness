  "notes": "总结这篇论文，第一，结构预测网络已经包含有价值的领域知识，通过去噪任务可以把它转化为生成先验，预训练并不只服务于判别任务。第二，条件是否有效，取决于科学要求能否落实为模型看得见的几何关系；motif、对称性和热点正是这样的接口。第三，生成器的价值最终由完整证据链决定，从序列设计、计算筛选到实验功能和结构，任何一步都不能被漂亮的生成图片替代。RFdiffusion在本文测试的多类任务上显著扩大了设计能力，但更极性的靶表面、广泛特异性与催化功能等问题仍有待检验。我们带走的不是万能设计器的结论，而是一个已经得到多层实验支持的可控结构生成起点。",
